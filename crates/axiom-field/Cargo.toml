[package]
name = "axiom-field"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rigid-body simulation of a fixed hobby-servo quadruped for software-only experiments."
license = "MIT"
publish = false

[dependencies]
axiom = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rapier3d = { version = "0.34", features = ["enhanced-determinism"] }
