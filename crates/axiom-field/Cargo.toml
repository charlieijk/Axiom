[package]
name = "axiom-field"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rigid-body field lab: a fixed hobby-servo quadruped modelled for sim-to-real transfer."
license = "MIT"
publish = false

[dependencies]
axiom = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rapier3d = { version = "0.32", features = ["enhanced-determinism"] }
