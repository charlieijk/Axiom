[workspace]
members = ["crates/axiom-field"]

[package]
name = "axiom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Embodied evolution sandbox with morphology, controllers, task fitness, and MAP-Elites search."
license = "MIT"
readme = "README.md"
repository = "https://github.com/charlieijk/Axiom"
homepage = "https://github.com/charlieijk/Axiom"
keywords = ["evolution", "simulation", "map-elites", "neuroevolution"]
categories = ["science", "simulation"]
include = [
    "/src/**",
    "/web/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/SECURITY.md",
    "/README.md",
    "/DEMO.md",
    "/docs/ARM64_OPTIMIZATION.md",
    "/docs/APPLE_SILICON.md",
    "/docs/ARCHITECTURE.md",
    "/docs/SUBMISSION_ASSETS.md",
    "/docs/axiom-arm64-result.png",
    "/docs/axiom-arm64-result.svg",
    "/docs/axiom-archive-lab-gen12.jpg",
    "/docs/axiom-archive-elite-cell-0-7.jpg",
    "/docs/axiom-archive-lab-gen13.jpg",
    "/docs/axiom-architecture.png",
    "/docs/axiom-core-loop.png",
    "/docs/axiom-core-loop.svg",
    "/docs/submission-assets.sha256",
    "/docs/benchmarks/**",
    "/LICENSE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
allocation-counting = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/bin/axiom.rs"
