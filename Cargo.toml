[package]
name = "axiom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Embodied evolution sandbox with morphology, controllers, task fitness, and MAP-Elites search."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/bin/axiom.rs"
