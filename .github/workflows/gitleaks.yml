name: gitleaks

on:
  # Branch commits are covered by the pull_request trigger below; listening to
  # an unfiltered push as well ran every one of them twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # gitleaks scans commit history, so the default shallow clone is not enough.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Digest published with the upstream v8.30.1 GitHub release asset.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --status
          tar -xz -C "$RUNNER_TEMP" -f "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history for secrets
        # --redact keeps any real secret out of the CI log, which is itself a
        # disclosure surface. If a false positive ever needs suppressing, add
        # a .gitleaksignore file (none is needed today — history scans clean).
        run: gitleaks git --no-banner --redact
