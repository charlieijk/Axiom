name: gitleaks

on:
  # Branch commits are covered by the pull_request trigger below; listening to
  # an unfiltered push as well ran every one of them twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, so the default shallow clone is not enough.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        # --redact keeps any real secret out of the CI log, which is itself a
        # disclosure surface. If a false positive ever needs suppressing, add
        # a .gitleaksignore file (none is needed today — history scans clean).
        run: gitleaks git --no-banner --redact
