name: Stable release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  apple-silicon:
    name: Build and publish Apple Silicon bundle
    if: github.repository == 'charlieijk/Axiom'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.96.1

      - name: Validate stable tag and crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable semantic version" >&2
            exit 1
          fi
          CRATE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "v$CRATE_VERSION" != "$RELEASE_TAG" ]]; then
            echo "tag $RELEASE_TAG does not match crate version $CRATE_VERSION" >&2
            exit 1
          fi

      - name: Build and smoke-test the real product
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uname -m | grep -qx arm64
          cargo build --release --locked --bin axiom
          test "$(./target/release/axiom --version)" = "axiom ${RELEASE_TAG#v}"
          ./target/release/axiom gui --check
          ./target/release/axiom demo
          file target/release/axiom | grep -q "Mach-O 64-bit executable arm64"
          codesign --verify --strict --verbose=4 target/release/axiom
          codesign -dv --verbose=4 target/release/axiom 2>&1 | grep -q "Signature=adhoc"

      - name: Package archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./script/package_release.sh \
            target/release/axiom \
            "$RELEASE_TAG" \
            aarch64-apple-darwin \
            release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="axiom-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          gh release create "$RELEASE_TAG" \
            "release/$ARCHIVE_NAME" \
            "release/$ARCHIVE_NAME.sha256" \
            --verify-tag \
            --title "Axiom $RELEASE_TAG" \
            --notes-file docs/APPLE_SILICON.md
