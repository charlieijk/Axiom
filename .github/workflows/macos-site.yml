name: macOS compatibility and site

on:
  # PR verification is covered by the Linux jobs; macOS bills at 10x and was
  # burning most of its minutes on Dependabot PRs. Runs per merge and on demand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-site:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          rustup default 1.96.1
      - name: Build canonical product
        run: ./script/build_and_run.sh --build-only
      - name: Verify locked site
        run: ./script/verify_site.sh
