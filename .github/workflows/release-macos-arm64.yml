name: Apple Silicon challenge release

"on":
  push:
    tags:
      - "arm-create-2026"

permissions:
  contents: write

jobs:
  release:
    name: Build Apple Silicon preview
    runs-on: macos-15

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up pinned release toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Build and smoke-test native binary
        run: |
          uname -m | grep -qx arm64
          cargo build --release --locked --bin axiom
          ./target/release/axiom gui --check
          ./target/release/axiom demo
          file target/release/axiom | grep -q "Mach-O 64-bit executable arm64"
          codesign --verify --strict --verbose=4 target/release/axiom
          codesign -dv --verbose=4 target/release/axiom 2>&1 | grep -q "Signature=adhoc"

      - name: Package archive and checksum
        env:
          RELEASE_NAME: axiom-${{ github.ref_name }}-aarch64-apple-darwin
        run: |
          mkdir -p "release/$RELEASE_NAME"
          install -m 0755 target/release/axiom "release/$RELEASE_NAME/axiom"
          cp LICENSE "release/$RELEASE_NAME/LICENSE"
          cp docs/APPLE_SILICON.md "release/$RELEASE_NAME/APPLE_SILICON.md"
          cp docs/ARM64_OPTIMIZATION.md "release/$RELEASE_NAME/ARM64_OPTIMIZATION.md"
          cp web/vendor/THREE-LICENSE.txt "release/$RELEASE_NAME/THREE-LICENSE.txt"
          cp -R docs/benchmarks "release/$RELEASE_NAME/benchmarks"
          COPYFILE_DISABLE=1 tar -C release -czf "release/$RELEASE_NAME.tar.gz" "$RELEASE_NAME"
          cd release
          shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.tar.gz.sha256"

      - name: Publish challenge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: axiom-${{ github.ref_name }}-aarch64-apple-darwin
        run: >-
          gh release create "${{ github.ref_name }}"
          "release/$RELEASE_NAME.tar.gz"
          "release/$RELEASE_NAME.tar.gz.sha256"
          --verify-tag
          --prerelease
          --title "Axiom — Arm Create 2026 Apple Silicon build"
          --notes-file docs/APPLE_SILICON.md
