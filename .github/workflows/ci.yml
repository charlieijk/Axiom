name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: JavaScript syntax
        # The graphics3d files are ES modules; parse everything as module
        # syntax via stdin so the check works on Node versions without
        # automatic module detection.
        run: |
          for file in web/*.js; do
            echo "checking ${file}"
            node --input-type=module --check < "${file}"
          done

      - name: Animation smoke test
        run: cargo run -- animate cpg --frames 3 --fps 0 --no-clear --width 60 --height 18

      - name: GUI smoke test
        run: cargo run -- gui --check

      - name: Package dry run
        run: cargo package --locked

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      # The MSRV promise covers the publishable `axiom` library only. The
      # `axiom-field` lab crate is `publish = false` and depends on rapier3d,
      # whose own floor (nalgebra 1.87) is above ours.
      - name: Test minimum supported Rust
        run: cargo test -p axiom --locked
