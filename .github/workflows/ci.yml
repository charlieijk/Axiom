name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Evidence tests bind the baseline hashes to commit 71d3897.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the workspace suite under instrumentation, so this covers the
      # `cargo test --workspace` gate as well as measuring it. The floor is a
      # ratchet set just under the measured 84% line coverage, not a target:
      # it is here to catch a regression, so raise it when coverage rises.
      - name: Test with coverage
        run: cargo llvm-cov --workspace --fail-under-lines 80

      - name: JavaScript syntax
        # Each file is parsed the way the browser parses it. web/app.js is a
        # classic `<script src>`: checked as a module it would ACCEPT an
        # `import` statement that the browser rejects with "Cannot use import
        # statement outside a module", so it is checked as a script instead.
        # The graphics3d files and the vendored Three.js build are ES modules.
        # Parsing goes via stdin so the check needs no package-type inference.
        run: |
          echo "checking web/app.js (classic script)"
          node --input-type=commonjs --check < web/app.js
          for file in web/graphics3d*.js web/vendor/*.js; do
            echo "checking ${file} (module)"
            node --input-type=module --check < "${file}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web lint toolchain
        # Root package.json is private and carries eslint only; the browser
        # clients themselves ship no dependencies.
        run: npm ci

      - name: Lint browser clients
        # web/app.js is a classic script and web/graphics3d*.js are ES modules;
        # eslint.config.mjs parses each in its own module system.
        run: npm run lint

      - name: Browser logic tests
        # Exercises web/app.js and the 3D journal modules under node:test. The
        # bare directory form is not a valid target, so the files are globbed.
        run: node --test web/tests/*.test.mjs

      - name: Animation smoke test
        run: cargo run -- animate cpg --frames 3 --fps 0 --no-clear --width 60 --height 18

      - name: GUI smoke test
        run: cargo run -- gui --check

      - name: Package dry run
        run: cargo package --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Fails on a known vulnerability in the dependency tree. Unmaintained-crate
      # warnings do not fail the build; today the only one is RUSTSEC-2024-0436
      # (paste), which arrives transitively through the physics stack.
      - name: Audit dependencies
        run: cargo audit

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      # The MSRV promise covers the publishable `axiom` library only. The
      # `axiom-field` lab crate is `publish = false` and depends on rapier3d,
      # whose own floor (nalgebra 1.87) is above ours.
      - name: Test minimum supported Rust
        run: cargo test -p axiom --locked

  site:
    name: Public site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix site ci

      - name: Lint
        run: npm --prefix site run lint

      - name: Test and build
        run: npm --prefix site test

  flask:
    name: Flask compatibility adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-flask-lock.txt

      - name: Install locked dependencies
        run: pip install -r requirements-flask-lock.txt

      - name: Test loopback and proxy boundaries
        run: python -m unittest discover -s tests_python -p 'test_*.py' -v

  arm64:
    name: Native Arm64 evidence smoke test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Keep the recorded pre-optimization revision available to the
          # baseline Git-object provenance test.
          fetch-depth: 0

      # `runner` is not a job-level context, so the evidence directory is
      # exported here rather than under the job's `env:`.
      - name: Locate the evidence directory outside the checkout
        run: echo "EVIDENCE_DIR=${{ runner.temp }}/axiom-arm64-evidence" >> "$GITHUB_ENV"

      - name: Set up pinned evidence toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Verify native Arm64 runner
        run: uname -m | grep -qx arm64

      - name: Verify checked-in full-run evidence
        run: cargo test --locked --test arm64_evidence

      - name: Create evidence directory outside the checkout
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Generate uninstrumented timing evidence
        run: >-
          cargo run --release --locked
          --example arm64_optimization_benchmark -- --quick
          > "$EVIDENCE_DIR/arm64-quick-timing.json"

      - name: Generate allocation evidence separately
        run: >-
          cargo run --release --locked --features allocation-counting
          --example arm64_optimization_benchmark -- --quick --allocations
          > "$EVIDENCE_DIR/arm64-quick-allocations.json"

      - name: Gate quick-run semantics and clean provenance
        run: |
          COMMON='
            .authoritative_arm64 == true and
            .environment.arch == "aarch64" and
            .environment.target_features.neon == true and
            .environment.git_dirty == false and
            .deterministic_outcome.full_report_digest == "e7d0667b1b176619" and
            .deterministic_outcome.full_report_sha256 == "e2600ca19373603be085a1e33ada40e6128c20ec76408fe5b61de890b46dbff7"'
          jq -e "$COMMON and
            .mode == \"timing\" and
            .environment.allocation_counting_feature == false and
            .timing.instrumented_allocator == false and
            .allocations == null
          " "$EVIDENCE_DIR/arm64-quick-timing.json"
          jq -e "$COMMON and
            .mode == \"allocations\" and
            .environment.allocation_counting_feature == true and
            .timing == null and
            .allocations.instrumented_allocator == true and
            .allocations.calls > 0 and
            .allocations.calls <= 50000 and
            .allocations.requested_bytes > 0 and
            .allocations.requested_bytes <= 20000000
          " "$EVIDENCE_DIR/arm64-quick-allocations.json"

      - name: Upload raw evidence
        uses: actions/upload-artifact@v7
        with:
          name: arm64-quick-evidence
          path: ${{ runner.temp }}/axiom-arm64-evidence/arm64-quick-*.json
          if-no-files-found: error
