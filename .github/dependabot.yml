version: 2
updates:
  # Rust workspace (root Cargo.toml + crates/axiom-field)
  - package-ecosystem: "cargo"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Flask shim (requirements-flask.txt + requirements-flask-lock.txt)
  - package-ecosystem: "pip"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Site frontend (site/package.json)
  - package-ecosystem: "npm"
    open-pull-requests-limit: 0
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
