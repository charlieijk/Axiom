<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axiom 3D Replay</title>
    <link rel="stylesheet" href="/graphics3d.css" />
  </head>
  <body>
    <main class="graphics-shell">
      <canvas id="graphics-canvas" aria-label="3D creature replay scene"></canvas>

      <section class="hud-layer" aria-label="3D replay HUD">
        <div class="objective-chip">
          <span>Objective</span>
          <strong id="objective-title">Test the evolved stride</strong>
          <small id="run-label">Evolving / rough / seed 29</small>
        </div>

        <div class="status-strip" aria-label="Replay status">
          <div>
            <span>Time</span>
            <strong id="metric-time">0.00s</strong>
          </div>
          <div>
            <span>Distance</span>
            <strong id="metric-distance">0.00</strong>
          </div>
          <div>
            <span>Tilt</span>
            <strong id="metric-tilt">0.00</strong>
          </div>
        </div>

        <details class="field-log">
          <summary>Field Log</summary>
          <p id="field-note">Evolving a compact population before replay.</p>
        </details>

        <div class="scene-actions" aria-label="Scene actions">
          <button id="play-toggle" type="button">Pause</button>
          <button id="reroll" type="button">Evolve</button>
          <button id="camera-mode" type="button">Follow</button>
          <button id="fx-toggle" type="button">Full FX</button>
          <a id="return-link" href="/" aria-label="Return to archive browser">Archive</a>
        </div>

        <div id="control-hint" class="control-hint">Drag to orbit</div>
      </section>
    </main>

    <script type="module" src="/graphics3d.js?v=biomech"></script>
  </body>
</html>
